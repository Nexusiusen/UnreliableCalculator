        <div>
          <div>
            <h1>Hollow tube calculator in mm3</h1>
            <label>Input height in meters</label>
            <input type="text" id="height" />
            <label>Input width in meters</label>
            <input type="text" id="width" />
            <label>Input Wall thickness in meters</label>
            <input type="text" id="walls" />
            <label>Input Length in meters</label>
            <input type="text" id="length" />
            <button id="volume">calculate</button>
            <div class="answerBox" id="vV"></div>
          </div>

          <h1>Weight calculator</h1>
          <label>Input density of material kg/m^3</label>
          <input type="text" id="density" />
          <label>Volume in mm3</label>
          <input type="text" id="vol" />
          <button id="mass">calculate</button>
          <div class="answerBox" id="mV"></div>

          <br />

          <h1>Range calculator</h1>
          <label>Tabel height</label>
          <input type="text" id="y0" />
          <label>Launch angle (degree)</label>
          <input type="text" id="theta" />
          <label>Inital velocity</label>
          <input type="text" id="v0" />
          <div class="answerBox" id="rV"></div>
          <button id="range">calculate</button>

          <br />

          <h1>Extension Calculator</h1>
          <label>Projectlie mass</label>
          <input type="text" id="Pm" />
          <label>Arm mass</label>
          <input type="text" id="Am" />
          <label>Spring constant</label>
          <input type="text" id="k" />
          <label>Projectlie speed</label>
          <input type="text" id="v0" />
          <label>Spring length </label>
          <input type="text" id="sl" />
          <div class="answerBox" id="fV"></div>
          <button id="force">calculate</button>

          <br />

          <h1>Spring Calculator</h1>
          <label>wire width</label>
          <input type="text" id="wireW" />
          <label>coil diameter</label>
          <input type="text" id="coil" />
          <label>length</label>
          <input type="text" id="l" />
          <button id="Spring">calculate</button>

          <br />
        </div>
      </div>
    </div>

    <script src="calculator.js"></script>
